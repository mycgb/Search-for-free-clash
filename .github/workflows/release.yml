name: Release (multi-platform)

# A tag like v1.0.0 builds Windows / macOS / Linux assets and publishes a Release.
# workflow_dispatch only builds and uploads artifacts (no Release is created),
# so you can verify the builds before publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-latest
            platform: macos
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk binutils

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && python -m pip install pyinstaller

      - name: Verify tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build binary asset
        run: python build_release.py
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.platform }}
          path: out/*.zip
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pack portable source bundle
        run: python build_release.py --source-only
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
      - uses: actions/upload-artifact@v7
        with:
          name: asset-source
          path: out/*.zip
          if-no-files-found: error

  publish:
    needs: [build, source]
    # always(): if one platform fails, still publish the assets that did build.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          path: assets
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum *.zip > SHA256SUMS.txt && ls -lh

      - name: Create / update Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading assets only."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            assets/*.zip assets/SHA256SUMS.txt --clobber
